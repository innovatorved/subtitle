[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-generator"
version = "4.1.1"
description = "Industry-standard, cross-platform AI subtitle generation, styling, QC, and embedding toolkit."
readme = "PYPI_README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ved Gupta", email = "vedgupta@protonmail.com"}
]
maintainers = [
    {name = "Ved Gupta", email = "vedgupta@protonmail.com"}
]
keywords = [
    "subtitle",
    "subtitles",
    "captions",
    "transcription",
    "whisper",
    "whisper.cpp",
    "faster-whisper",
    "vad",
    "ai",
    "speech-to-text",
    "video",
    "audio",
    "srt",
    "vtt",
    "ass",
    "ttml",
    "karaoke",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "tqdm>=4.66.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.5.1"]
yt = ["yt-dlp>=2024.12.0"]
gdrive = ["gdown>=5.2.0"]
faster-whisper = ["faster-whisper>=1.1.0"]
cloud = ["openai>=1.50.0"]
translate = ["argostranslate>=1.9.6"]
all = [
    "imageio-ffmpeg>=0.5.1",
    "yt-dlp>=2024.12.0",
    "gdown>=5.2.0",
    "faster-whisper>=1.1.0",
    "openai>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/innovatorved/subtitle"
Documentation = "https://subtitle.vedgupta.in"
Repository = "https://github.com/innovatorved/subtitle.git"
Issues = "https://github.com/innovatorved/subtitle/issues"
Changelog = "https://github.com/innovatorved/subtitle/releases"

[project.scripts]
subtitle = "subtitle_generator.cli.commands:main"

[tool.setuptools]
packages = [
    "subtitle_generator",
    "subtitle_generator.cli",
    "subtitle_generator.core",
    "subtitle_generator.models",
    "subtitle_generator.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
