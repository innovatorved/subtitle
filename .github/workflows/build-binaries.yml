name: Build Prebuilt whisper-cli Binaries

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: "Branch/tag of innovatorved/whisper.cpp to build"
        required: false
        default: "develop"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'whisper-binaries'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: whisper-cli-darwin-arm64
            cmake_flags: "-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF"
            bin_rel: build/bin/whisper-cli
            smoke_test: "true"
          - os: macos-latest
            asset: whisper-cli-darwin-x86_64
            cmake_flags: "-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64"
            bin_rel: build/bin/whisper-cli
            smoke_test: "false"
          - os: ubuntu-latest
            asset: whisper-cli-linux-x86_64
            cmake_flags: "-DGGML_NATIVE=OFF"
            bin_rel: build/bin/whisper-cli
            smoke_test: "true"
          - os: ubuntu-24.04-arm
            asset: whisper-cli-linux-arm64
            cmake_flags: "-DGGML_NATIVE=OFF"
            bin_rel: build/bin/whisper-cli
            smoke_test: "true"
          - os: windows-latest
            asset: whisper-cli-windows-x86_64.exe
            cmake_flags: "-DGGML_NATIVE=OFF"
            bin_rel: build/bin/Release/whisper-cli.exe
            smoke_test: "true"

    steps:
      - name: Clone innovatorved/whisper.cpp
        shell: bash
        run: |
          REF="${{ github.event.inputs.whisper_ref || 'develop' }}"
          git clone --depth 1 --branch "$REF" https://github.com/innovatorved/whisper.cpp.git whisper-src

      - name: Configure & Build
        shell: bash
        run: |
          cmake -B whisper-src/build -S whisper-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            ${{ matrix.cmake_flags }}
          cmake --build whisper-src/build --config Release --parallel

      - name: Package & Generate SHA-256
        shell: bash
        run: |
          mkdir -p artifacts
          cp "whisper-src/${{ matrix.bin_rel }}" "artifacts/${{ matrix.asset }}"
          chmod +x "artifacts/${{ matrix.asset }}" || true
          if [ "${{ matrix.smoke_test }}" = "true" ]; then
            "artifacts/${{ matrix.asset }}" -h > /dev/null
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd artifacts && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd artifacts && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/

  publish-binaries:
    name: Publish whisper-binaries Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-binaries
          merge-multiple: true

      - name: Publish to whisper-binaries release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          if gh release view whisper-binaries --repo "$REPO" >/dev/null 2>&1; then
            gh release upload whisper-binaries dist-binaries/* --repo "$REPO" --clobber
          else
            gh release create whisper-binaries dist-binaries/* \
              --repo "$REPO" \
              --title "Prebuilt whisper-cli Binaries" \
              --notes "Cross-platform prebuilt whisper-cli binaries with native -vi and Silero VAD support."
          fi
