name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "PYPI_README.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check subtitle_generator tests
      - name: Mypy type check
        run: mypy subtitle_generator

  test:
    name: Unit Tests (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/unit/ -q
      - name: CLI smoke check
        shell: bash
        run: |
          subtitle --version
          subtitle formats
          subtitle doctor --json || true

  e2e-real-video:
    name: Real Video E2E (${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with bundled FFmpeg
        run: pip install ".[ffmpeg]"
      - name: Zero-config E2E (prebuilt whisper-cli + VAD + multi-format + lint + merge + burn)
        shell: bash
        run: |
          mkdir -p e2e_out e2e_merge e2e_burn
          subtitle example/story.mp4 --model tiny --format srt,vtt,ass --preset netflix --style karaoke -o e2e_out --json
          test -s e2e_out/story.srt && test -s e2e_out/story.vtt && test -s e2e_out/story.ass
          subtitle doctor
          subtitle lint e2e_out/story.srt --standard netflix
          subtitle shift e2e_out/story.srt --offset 500 -o e2e_out/shifted.srt
          test -s e2e_out/shifted.srt
          subtitle example/story.mp4 --model tiny --merge --format srt -o e2e_merge
          test -s e2e_merge/story_subtitled.mp4
          subtitle example/story.mp4 --model tiny --burn --style karaoke --preset reels -o e2e_burn
          test -s e2e_burn/story_burned.mp4
